<main class="main">

  <h1>Quizzes</h1>

  @if (isLoading) {
    <p>Loading quizzes...</p>
  }

   @if (errorMessage) {
    <p>{{ errorMessage }}</p>
  }

  <ul>
    @for (quiz of quizzes; track quiz.id) {
      <li [attr.data-quiz-id]="quiz.id">
        {{ quiz.name }}
      </li>
    }
  </ul>
</main>
